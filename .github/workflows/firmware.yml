name: firmware

on:
  push:
    paths:
      - "proto/**"
      - "firmware/**"
      - "tools/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "proto/**"
      - "firmware/**"
      - "tools/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  host-tests:
    name: Protocol + core tests (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install generators
        run: pip install grpcio-tools "nanopb==$(cat firmware/components/nanopb/VERSION)"
      - name: Generated code is up to date
        run: |
          ./tools/gen_proto.sh
          python3 tools/refcodec/gen_vectors.py
          git diff --exit-code -- firmware/components/rv_proto proto/testvectors
      - name: Reference codec tests
        run: python3 -m unittest -v tools/refcodec/test_framing.py
      - name: rv_core tests (C, incl. ASan/UBSan fuzz smoke)
        run: python3 -m unittest -v firmware/components/rv_core/test/test_rv_core.py

  build:
    name: Build ${{ matrix.target }} firmware
    runs-on: ubuntu-24.04
    needs: host-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          # XIAO ESP32-S3: native USB, merged image starts at 0x0
          - target: esp32s3
            offset: "0x0"
          # Classic ESP32 (NodeMCU-32S, DevKitC): bootloader at 0x1000
          - target: esp32
            offset: "0x1000"
          # Waveshare ESP32-C5 (dual-band Wi-Fi 6, RISC-V): native USB, merged at 0x0 (web flasher).
          # app_offset: a second image starting at the bootloader (0x2000), for the EXPERIMENTAL
          # in-app flasher, which checks the 0xE9 header at byte 0.
          - target: esp32c5
            offset: "0x0"
            app_offset: "0x2000"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # git describe -> firmware version
      - name: idf.py build + merged image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: ${{ matrix.target }}
          path: firmware/${{ matrix.target }}
          command: >-
            set -o pipefail;
            idf.py build 2>&1 | tee build.log &&
            (cd build && python -m esptool --chip ${{ matrix.target }} merge_bin
            --target-offset ${{ matrix.offset }}
            -o retrovision-${{ matrix.target }}-merged.bin @flash_args) &&
            ${{ matrix.app_offset && format('(cd build && python -m esptool --chip {0} merge_bin --target-offset {1} -o retrovision-{0}-app.bin @flash_args) &&', matrix.target, matrix.app_offset) || '' }}
            idf.py size | tee -a build.log
      # Surface compiler errors as annotations (readable without log access).
      - name: Report build errors
        if: failure()
        run: |
          f=firmware/${{ matrix.target }}/build.log
          [ -f "$f" ] || { echo "::error::no build.log (failed before build)"; exit 0; }
          grep -nE "error:|Error:|CMake Error|FAILED:|undefined reference|ninja: build stopped|overflow" "$f" \
            | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          tail -30 "$f" | while IFS= read -r l; do echo "::warning::${l//%/%25}"; done
      - name: Upload firmware
        uses: actions/upload-artifact@v5
        with:
          name: retrovision-${{ matrix.target }}
          path: |
            firmware/${{ matrix.target }}/build/retrovision-${{ matrix.target }}-merged.bin
            firmware/${{ matrix.target }}/build/retrovision-${{ matrix.target }}-app.bin
            firmware/${{ matrix.target }}/build/retrovision_${{ matrix.target }}.bin
            firmware/${{ matrix.target }}/build/retrovision_${{ matrix.target }}.elf
            firmware/${{ matrix.target }}/build/bootloader/bootloader.bin
            firmware/${{ matrix.target }}/build/partition_table/partition-table.bin
            firmware/${{ matrix.target }}/build/flash_args
          if-no-files-found: error
