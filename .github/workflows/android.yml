name: android

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - "proto/**"
      - "firmware/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "proto/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml

  build:
    name: Test core + build APK
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the dev-build release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch firmware built from this commit
        uses: actions/download-artifact@v4
        with:
          name: retrovision-esp32s3
          path: fw

      - name: Bundle firmware into the APK
        run: |
          set -e
          bin=$(find fw -name retrovision-esp32s3-merged.bin | head -1)
          [ -n "$bin" ] || { echo "::error::merged firmware image not found in artifact"; exit 1; }
          d=android/app/src/main/assets/firmware
          mkdir -p "$d"
          cp "$bin" "$d/"
          ver=$(git describe --tags --always --dirty)
          python3 - "$ver" <<'PY'
          import json, sys
          json.dump({"version": sys.argv[1], "images": [
              {"id": "esp32s3", "chip": "ESP32-S3", "offset": 0,
               "file": "retrovision-esp32s3-merged.bin"}]},
              open("android/app/src/main/assets/firmware/manifest.json", "w"), indent=2)
          PY
          echo "RV_VERSION_NAME=$ver" >> "$GITHUB_ENV"
          echo "RV_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Core unit tests
        working-directory: android
        run: set -o pipefail; ./gradlew --no-daemon :core:test 2>&1 | tee ../gradle-test.log

      - name: Build release APK
        working-directory: android
        run: set -o pipefail; ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee ../gradle-app.log

      # Make compiler errors readable without log access.
      - name: Report build errors
        if: failure()
        run: |
          for f in gradle-test.log gradle-app.log; do
            [ -f "$f" ] || continue
            grep -nE "^e: |error:|What went wrong|Execution failed|FAILED|Could not " "$f" \
              | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          done

      - name: Name the APK
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "Retrovision-${RV_VERSION_NAME}.apk"
          cp "$(find fw -name retrovision-esp32s3-merged.bin | head -1)" "retrovision-esp32s3-${RV_VERSION_NAME}.bin"
          sha256sum Retrovision-*.apk retrovision-esp32s3-*.bin | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: retrovision-apk
          path: |
            Retrovision-*.apk
            retrovision-esp32s3-*.bin
            SHA256SUMS
          if-no-files-found: error

      - name: Publish dev build
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-latest >/dev/null 2>&1 || \
            gh release create dev-latest --prerelease --target "$GITHUB_SHA" \
              --title "Dev build (latest)" --notes "placeholder"
          gh release upload dev-latest Retrovision-*.apk retrovision-esp32s3-*.bin SHA256SUMS --clobber
          gh release edit dev-latest --prerelease --notes "Automatic build of ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Signed with the public development key: fine for sideloading, not a trust anchor. Checksums in SHA256SUMS."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes Retrovision-*.apk retrovision-esp32s3-*.bin SHA256SUMS
